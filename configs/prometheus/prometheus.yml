scrape_configs:
- job_name: infrastructure
  scrape_interval: 60s
  metrics_path: "/metrics"
  static_configs:
  - targets: [
      'grafana:3000',
      'loki:3100',
      'prometheus:9090',
      'node_exporter:9100'
  ]

- job_name: wordltime
  static_configs:
  - targets: [
    'worldtime:8000'
  ]
